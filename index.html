
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My First Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #fff7ed;
      color: #333;
      padding: 50px 20px;
    }

    h1 {
      color: #7c4328;
    }

    .card {
      max-width: 500px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
    }

    button {
      background: #7c4328;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Welcome to My Café!</h1>
  <p>My very first website is online soon.</p>

  <div class="card">
    <h2>Our Menu</h2>
    <p>☕ Coffee — KSh 200</p>
    <p>🍵 Tea — KSh 100</p>
    <button onclick="alert('Thanks for visiting my website!')">
      Say Hello
    </button>
  </div>
</body>
</html>
